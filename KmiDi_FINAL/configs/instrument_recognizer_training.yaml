# Training Configuration for Instrument Recognizer
# Dual-head CNN for technical (instrument+technique) and emotional (expression+sentiment) recognition

model:
  name: instrumentrecognizer
  task: audio_classification
  architecture: multi_head_cnn

  # Backbone CNN
  backbone:
    type: cnn
    layers:
      - type: conv2d
        in_channels: 1
        out_channels: 64
        kernel_size: 7
        stride: 2
        padding: 3
      - type: conv2d
        in_channels: 64
        out_channels: 128
        kernel_size: 3
        stride: 2
        padding: 1
      - type: conv2d
        in_channels: 128
        out_channels: 256
        kernel_size: 3
        stride: 2
        padding: 1
      - type: conv2d
        in_channels: 256
        out_channels: 512
        kernel_size: 3
        stride: 2
        padding: 1
      - type: adaptive_avg_pool
        output_size: 1
      - type: flatten
      - type: dense
        in_features: 512
        out_features: 512
        activation: relu

  # Technical Head
  technical_head:
    layers:
      - type: dense
        in_features: 512
        out_features: 256
        activation: relu
      - type: dropout
        p: 0.3
      - type: dense
        in_features: 256
        out_features: 128
        activation: relu
      - type: dense
        in_features: 128
        out_features: 80
    outputs:
      instrument_family: 16
      instrument_specific: 32
      technique: 16
      articulation: 8
      register: 4
      timbre_brightness: 4

  # Emotional Head
  emotional_head:
    layers:
      - type: dense
        in_features: 512
        out_features: 256
        activation: gelu
      - type: dropout
        p: 0.25
      - type: dense
        in_features: 256
        out_features: 128
        activation: gelu
      - type: dense
        in_features: 128
        out_features: 80
    outputs:
      expression_style: 12
      energy_level: 8
      musical_role: 8
      sentiment_valence: 8
      sentiment_arousal: 8
      dynamic_range: 4
      human_feel: 8
      vibrato_intensity: 4
      attack_character: 8
      sustain_character: 8
      genre_feel: 4

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 1e-5

  # Multi-task loss weights
  loss_weights:
    technical: 1.0
    emotional: 0.8

  # Learning rate schedule
  lr_scheduler: cosine
  lr_warmup_epochs: 10
  lr_min_factor: 0.01

  # Regularization
  dropout: 0.3
  label_smoothing: 0.1

  # Early stopping
  early_stopping: true
  patience: 15
  min_delta: 1e-4

  # Mixed precision
  use_amp: true
  amp_dtype: float16

data:
  # Dataset paths (to be configured)
  train_dir: data/datasets/instrument_dataset_v1/train
  val_dir: data/datasets/instrument_dataset_v1/val
  test_dir: data/datasets/instrument_dataset_v1/test

  # Data splits (if using single directory)
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

  # Audio processing
  sample_rate: 22050
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  duration_seconds: 3.0

  # Augmentation
  augmentation:
    enabled: true
    time_shift: 0.1
    pitch_shift: 2
    time_stretch: 0.1
    noise: 0.01
    gain: 0.1

  num_workers: 4
  pin_memory: true

checkpointing:
  save_dir: checkpoints/instrument_recognizer
  save_every_n_epochs: 5
  keep_n_checkpoints: 3
  save_best_only: true

export:
  formats: [rtneural, onnx, coreml]
  output_dir: ml/models
  include_metadata: true

logging:
  log_dir: logs/instrument_recognizer
  log_to_tensorboard: true
  log_to_wandb: false
  log_every_n_steps: 10

# Notes:
# - Requires instrument_dataset_v1 dataset with dual annotations:
#   - Technical: instrument_family, instrument_specific, technique, articulation, register
#   - Emotional: expression_style, energy_level, musical_role, sentiment, dynamics
# - Can use synthetic data generation from penta_core/ml/datasets/instrument_synthetic.py
# - Fallback available using spectral heuristics if model unavailable
