[build-system]
requires = ["setuptools>=65", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

# This repo is not a uv workspace; music_brain is the single package at root.
[tool.uv.workspace]
members = []

[project]
name = "KmiDi"
version = "1.0.0"
description = "KmiDi: Unified Music Intelligence & Audio Workstation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "KmiDi Project Team"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.8,<2",
    "pydantic>=2.0,<3",
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0,<3",
    "librosa>=0.10,<1",
]
dev = [
    "pybind11>=2.10",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "httpx>=0.24",
]
audio = [
    "soundfile>=0.12",
    "pydub>=0.25",
    "librosa>=0.10,<1",
]
jepa = [
    "lhotse>=1.20",
    "soundfile>=0.12",
]
coreml = [
    "coremltools>=8.0,<10",
]
nlm_train = [
    "transformers",
    "peft",
    "accelerate",
    "bitsandbytes",
    "trl",
    "einops",
]

[tool.setuptools.packages.find]
include = ["music_brain*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--color=yes",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "cpp: Tests requiring C++ bindings",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
minversion = "3.8"
