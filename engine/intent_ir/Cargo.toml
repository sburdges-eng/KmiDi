[package]
name = "intent_ir"
version = "0.1.0"
edition = "2021"

[lib]
name = "intent_ir"
crate-type = ["staticlib", "rlib"]

# panic = "abort" in release is the FFI safety posture (no unwinding through
# the C boundary). Dev/test builds keep the default unwind strategy so the
# test harness can report per-test panics.
[profile.release]
panic = "abort"
lto = true

[dependencies]

[dev-dependencies]

[build-dependencies]
cbindgen = "0.26"
