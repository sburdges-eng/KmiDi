# KMiDi Parallel Workflow Policy
# Gemini: planning, review, exploration, code proposals
# Claude: heavy coding, all commits and approvals
#
# Load with: gemini --policy .gemini/policies/kmidi-parallel.toml

# ============================================================================
# FULL READ ACCESS
# ============================================================================

[[rule]]
decision = "allow"
priority = 950
toolName = "read_file"

[[rule]]
decision = "allow"
priority = 950
toolName = "list_directory"

[[rule]]
decision = "allow"
priority = 950
toolName = "grep_search"

[[rule]]
decision = "allow"
priority = 950
toolName = "glob"

