[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal_listening_core"
version = "0.1.0"
description = "Minimal listening core: intent inference, ValueState derivation, constraint enforcement"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["minimal_listening_core*"]
