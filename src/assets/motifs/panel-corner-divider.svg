<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <title>Panel corner / section divider accent motif</title>
  <g id="panel-corner-motif" stroke-linecap="round" stroke-linejoin="round">
    <!-- L-shaped bracket (corner) -->
    <path id="corner-bracket" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" d="M 8 8 L 8 40 L 40 40"/>
    <!-- Etched inner lines (parallel to edges) -->
    <line id="etch-h" x1="8" y1="14" x2="34" y2="14" stroke="rgba(255,255,255,0.06)" stroke-width="0.35"/>
    <line id="etch-v" x1="14" y1="8" x2="14" y2="34" stroke="rgba(255,255,255,0.06)" stroke-width="0.35"/>
    <!-- Calibration marks at corner -->
    <g id="corner-ticks" stroke="rgba(255,255,255,0.08)" stroke-width="0.35">
      <line x1="8" y1="20" x2="11" y2="20"/>
      <line x1="8" y1="28" x2="11" y2="28"/>
      <line x1="20" y1="40" x2="20" y2="37"/>
      <line x1="28" y1="40" x2="28" y2="37"/>
    </g>
    <!-- Restrained amber: corner vertex emphasis -->
    <circle id="accent-vertex" cx="8" cy="40" r="1" fill="rgba(201,162,39,0.25)" stroke="none"/>
  </g>
</svg>
