# Sprint 1 – Core Testing & Quality workflow YAML
# Place in: iDAW/.github/workflows/
name: "Sprint 1 – Core Testing & Quality"
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -v
      - run: pytest tests/integration/ -v || true
  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init JUCE submodule
        # Selective init — only external/JUCE. Avoids tying this job to
        # the health of .worktrees/integration-finalize (the local-worktree
        # gitlink), which is not a build dependency.
        run: git submodule update --init --depth 1 external/JUCE
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev
      - name: Install JUCE Linux deps
        run: scripts/ci/install_juce_linux_deps.sh
      - name: C++ Build & Test
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j
          ctest --output-on-failure