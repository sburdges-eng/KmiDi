name: C++ CI (Monorepo)

on:
  push:
    branches: [main, develop, 'feature/**', 'copilot/**']
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'src_penta-core/**'
      - 'engine/**'
      - 'rt_harness/**'
      - 'tests/cpp/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci-cpp.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'src_penta-core/**'
      - 'engine/**'
      - 'rt_harness/**'
      - 'tests/cpp/**'
      - 'CMakeLists.txt'

jobs:
  build:
    name: ${{ matrix.build_type }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # bash everywhere: windows-latest defaults to pwsh, which cannot parse the
    # backslash line continuations in the cmake configure step below.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-multimedia-dev \
            libasound2-dev \
            portaudio19-dev \
            libsndfile1-dev \
            libfftw3-dev \
            ccache

      - name: Install JUCE Linux deps
        if: runner.os == 'Linux'
        run: scripts/ci/install_juce_linux_deps.sh
      
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja qt@6 portaudio libsndfile fftw ccache
      
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja
      
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.build_type }}

      - name: Verify JUCE patch drift (pre-build)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/juce/apply_patches.sh --check

      - name: Apply JUCE patches
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/juce/apply_patches.sh
      
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        # Without this, cmake+Ninja under bash resolves cc to Strawberry
        # Perl's MinGW gcc from PATH, which miscompiles JUCE (pointer_sized_int
        # becomes 32-bit int and juceaide fails during configure).
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=ON \
            -DBUILD_PLUGINS=OFF \
            -DBUILD_DESKTOP=ON
      
      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build_type }} -j ${{ runner.os == 'Windows' && '4' || '$(nproc)' }}
      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure -C ${{ matrix.build_type }}
      
      - name: Upload build artifacts (Release only)
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: kelly-core-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/engine/libengine.a
            build/rt_harness/rt_harness
          retention-days: 7
  
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck
      
      - name: Run clang-tidy
        run: |
          find src plugins src_penta-core engine rt_harness -name '*.cpp' -o -name '*.h' 2>/dev/null | \
            xargs clang-tidy -p build || true
        continue-on-error: true
      
      - name: Run cppcheck
        run: |
          cppcheck --enable=all --inconclusive --xml --xml-version=2 \
            src plugins src_penta-core engine rt_harness 2> cppcheck-report.xml || true
        continue-on-error: true
      
      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            cppcheck-report.xml
          retention-days: 30
