name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend (TypeScript & Build)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install dependencies
      run: npm ci
    - name: TypeScript check
      run: npx tsc --noEmit
    - name: Build frontend
      run: npm run build

  python_tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install -e .
        pip install numpy scipy torch librosa pyyaml
        pip install pytest pytest-cov coverage
    - name: Sync canonical entity contracts
      run: |
        python3 scripts/sync_entities.py
    - name: Verify generated contracts are committed
      run: |
        git diff --exit-code -- shared_schemas/CompleteSongIntentRequest.json src/types/Intent.ts src-tauri/src/generated/intent.rs
    - name: Run schema security tests
      run: pytest tests/unit/test_api_schema.py -q
    - name: Run Python tests
      run: |
        pytest tests/unit/ -v --cov=music_brain --cov-report=xml --cov-report=term-missing
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  cpp_build:
    name: C++ Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev
    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja \
          -DBUILD_PENTA_TESTS=ON \
          -DBUILD_PYTHON_BINDINGS=OFF \
          -DBUILD_KELLY_CORE=OFF
    - name: Build C++ library
      run: |
        cd build
        ninja penta_core
    - name: Build tests
      run: |
        cd build
        ninja penta_tests
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cpp-build
        path: build/
        retention-days: 1

  cpp_tests:
    name: C++ Tests
    runs-on: ubuntu-latest
    needs: cpp_build
    steps:
    - uses: actions/checkout@v4
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: cpp-build
        path: build/
    - name: Restore execute permissions
      run: |
        chmod +x build/penta_tests || true
        find build -name "*.so" -exec chmod +x {} \; || true
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --verbose

  valgrind_memory:
    name: Valgrind Memory Testing
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev valgrind
    - name: Configure CMake (Debug)
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Debug -G Ninja \
          -DBUILD_PENTA_TESTS=ON \
          -DBUILD_PYTHON_BINDINGS=OFF \
          -DBUILD_KELLY_CORE=OFF
    - name: Build tests
      run: |
        cd build
        ninja penta_tests
    - name: Run Valgrind
      run: |
        cd build
        if [ -f ../tests/valgrind.supp ]; then
          valgrind --leak-check=full --error-exitcode=1 --track-origins=yes \
            --suppressions=../tests/valgrind.supp \
            --show-leak-kinds=definite \
            ./penta_tests
        else
          valgrind --leak-check=full --error-exitcode=1 --track-origins=yes \
            --show-leak-kinds=definite \
            ./penta_tests
        fi

  performance_regression:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev
    - name: Configure CMake (Release)
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja \
          -DBUILD_PENTA_TESTS=ON \
          -DBUILD_PYTHON_BINDINGS=OFF \
          -DBUILD_KELLY_CORE=OFF
    - name: Build tests
      run: |
        cd build
        ninja penta_tests
    - name: Run performance benchmarks
      run: |
        cd build
        ./penta_tests --gtest_filter="*Performance*"
        # Note: Performance targets:
        # - Harmony latency < 100μs @ 48kHz/512 samples
        # - Groove latency < 200μs @ 48kHz/512 samples

  code_coverage:
    name: Code Coverage Reporting
    runs-on: ubuntu-latest
    needs: [python_tests, cpp_tests]
    steps:
    - uses: actions/checkout@v4
    - name: Install C++ coverage tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev lcov
    - name: Configure CMake (Coverage)
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Debug -G Ninja \
          -DCMAKE_CXX_FLAGS="--coverage" \
          -DBUILD_PENTA_TESTS=ON \
          -DBUILD_PYTHON_BINDINGS=OFF \
          -DBUILD_KELLY_CORE=OFF
    - name: Generate C++ coverage
      run: |
        cd build
        ninja penta_tests
        ./penta_tests
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '/opt/*' '*/external/*' '*/tests/*' --output-file coverage.info
        lcov --list coverage.info
    - name: Upload C++ coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./build/coverage.info
        fail_ci_if_error: false

  juce_plugin_validation:
    name: JUCE Plugin Validation (macOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        brew install cmake ninja qt@6
    - name: Build JUCE plugins
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja
        ninja iDAW_Core || true  # May not be fully configured
    - name: Validate plugins with auval
      run: |
        # Validate Audio Unit plugins (if built)
        # auval -v aufx KmDi Pncl || true  # Pencil
        # auval -v aufx KmDi Ersr || true  # Eraser
        # auval -v aufx KmDi Prss || true  # Press
        echo "JUCE plugin validation placeholder - requires full plugin build"

  v1_shell_build:
    name: V1 Shell (Tauri + React)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install system dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libasound2-dev \
          libjack-dev \
          qt6-base-dev \
          ninja-build
    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        pip install pybind11 pydantic
    - name: Sync canonical entities
      run: python3 scripts/sync_entities.py
    - name: Verify entity contract drift
      run: |
        git diff --exit-code -- shared_schemas/CompleteSongIntentRequest.json src/types/Intent.ts src-tauri/src/generated/intent.rs
    - name: Bootstrap
      run: ./bootstrap.sh
    - name: Build Kelly FFI (C++ core for Tauri)
      run: |
        PYBIND_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
        cmake -B build -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -Dpybind11_DIR="$PYBIND_DIR" \
          -DBUILD_KELLY_CORE=ON \
          -DBUILD_KELLY_FFI=ON \
          -DBUILD_DESKTOP=OFF \
          -DBUILD_PLUGINS=OFF \
          -DBUILD_PYTHON_BINDINGS=OFF \
          -DBUILD_PENTA_TESTS=OFF \
          -DKMIDI_BUILD_QT_UI=OFF \
          -DKMIDI_BUILD_JUCE_UI=OFF
        cmake --build build --target KellyFFI --parallel 4
    - name: Build Tauri app
      run: |
        npm ci
        npm run tauri build
    - name: Run Tauri integration tests
      run: |
        cd src-tauri && cargo test --no-fail-fast

  secrets_scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Secrets scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install linting tools
      run: |
        pip install black flake8 mypy
    - name: Run black formatting check
      run: black --check --line-length=100 music_brain/ tests/ || true
    - name: Run flake8 linting
      run: flake8 music_brain/ tests/ --max-line-length=100 --extend-ignore=E203,W503 || true
    - name: Run mypy type checking
      run: mypy music_brain/ tests/ --ignore-missing-imports || true
