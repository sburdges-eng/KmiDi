# KmiDi MIDI Companion — CI
# Runs boot check and stub-creep check; optionally tests.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Boot & stub-creep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Brain check
        run: python run_brain.py check
        working-directory: ${{ github.workspace }}

      - name: Stub-creep check
        run: python scripts/check_stub_creep.py --allow-docs
        working-directory: ${{ github.workspace }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Pytest
        run: python -m pytest tests/ -v --tb=short
        working-directory: ${{ github.workspace }}
        continue-on-error: true
